[project]
name = "s5-streamlit-churn-ejemplos"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Santiago Lillo Macías", email = "santilillomacias@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "google-genai>=2.28.0",
    "pillow>=12.3.0",
    "streamlit>=1.65.0",
    "watchdog>=6.0.0",
]

[project.scripts]
s5-streamlit-churn-ejemplos = "s5_streamlit_churn_ejemplos:main"

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
